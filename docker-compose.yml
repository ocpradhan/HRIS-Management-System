version: "3.8"

services:
  # 1. Express API Service
  backend:
    image: node:20-alpine
    container_name: hris-backend-API
    working_dir: /app
    ports:
      - "5000:5000"
    command: sh -c "npm install && npx prisma db push && npm run dev"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:frostcrawler@db:5432/hris_production?schema=public
      - JWT_SECRET=use_a_long_complex_random_string_here_for_your_system
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 2. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: hris-postgres-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: frostcrawler
      POSTGRES_DB: hris_production
    volumes:
      - hris_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hris_production"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hris_pgdata:
